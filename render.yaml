services:
  - type: web
    name: rao-extractor-surf-analysis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 app:app
    healthCheckPath: /health
    autoDeployTrigger: commit
